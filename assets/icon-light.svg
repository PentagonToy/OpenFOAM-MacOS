<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.22"/>
    </filter>
    <clipPath id="drum"><circle cx="512" cy="527" r="96"/></clipPath>
  </defs>

  <!-- Tile -->
  <rect x="185" y="185" width="654" height="654" rx="170" fill="#068487" filter="url(#shadow)"/>

  <!-- Machine body -->
  <rect x="332" y="307" width="360" height="410" rx="22" fill="#FFFFFF"/>

  <!-- Knobs -->
  <circle cx="584" cy="348" r="16" fill="#068487"/>
  <circle cx="640" cy="348" r="16" fill="#068487"/>

  <!-- Door rings -->
  <circle cx="512" cy="527" r="124" fill="#0B6E70"/>
  <circle cx="512" cy="527" r="110" fill="#FFFFFF"/>

  <!-- Drum: dark purple top, lighter wave below -->
  <circle cx="512" cy="527" r="96" fill="#740A7A"/>
  <g clip-path="url(#drum)">
    <path d="M400 522 Q452 496 512 522 T624 522 V640 H400 Z" fill="#93309A"/>
  </g>

  <!-- Foam bubbles -->
  <circle cx="525" cy="499" r="9" fill="#FFFFFF"/>
  <circle cx="548" cy="483" r="6" fill="#FFFFFF"/>
  <circle cx="556" cy="517" r="11" fill="#FFFFFF"/>
</svg>